# XcodeGen spec — a fallback way to regenerate Repp.xcodeproj from scratch.
# The checked-in project file is authoritative; this exists so the project can be
# rebuilt if it ever gets mangled by a merge. Run: xcodegen generate
name: Repp
options:
  bundleIdPrefix: com.repp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Repp:
    type: application
    platform: iOS
    sources:
      - Repp
      - ReppShared
    dependencies:
      - target: ReppShield
      - target: ReppShieldAction
      - target: ReppMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repp.app
        CODE_SIGN_ENTITLEMENTS: Config/Repp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Repp
        INFOPLIST_KEY_NSMotionUsageDescription: "Repp uses motion to count your reps. Nothing is recorded or uploaded."
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

  ReppShield:
    type: app-extension
    platform: iOS
    sources:
      - ReppShield
      - ReppShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repp.app.shield
        CODE_SIGN_ENTITLEMENTS: Config/ReppShield.entitlements
        INFOPLIST_FILE: Config/ReppShield-Info.plist

  ReppShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - ReppShieldAction
      - ReppShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repp.app.shieldaction
        CODE_SIGN_ENTITLEMENTS: Config/ReppShieldAction.entitlements
        INFOPLIST_FILE: Config/ReppShieldAction-Info.plist

  ReppMonitor:
    type: app-extension
    platform: iOS
    sources:
      - ReppMonitor
      - ReppShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repp.app.monitor
        CODE_SIGN_ENTITLEMENTS: Config/ReppMonitor.entitlements
        INFOPLIST_FILE: Config/ReppMonitor-Info.plist
