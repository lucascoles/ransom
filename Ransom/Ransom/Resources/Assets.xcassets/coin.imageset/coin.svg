<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- rim, face, and a struck edge, so it reads as a coin at 20px and not a dot -->
  <circle cx="50" cy="50" r="46" fill="#C77F12"/>
  <circle cx="50" cy="47" r="46" fill="#F0B429"/>
  <circle cx="50" cy="47" r="37" fill="#FFCE4A"/>
  <circle cx="50" cy="47" r="37" fill="none" stroke="#D99A1F" stroke-width="3"/>
  <!-- a dumbbell: what the coin was minted for -->
  <g fill="#B06E0C">
    <rect x="34" y="43" width="32" height="8" rx="4"/>
    <rect x="27" y="37" width="9" height="20" rx="4.5"/>
    <rect x="64" y="37" width="9" height="20" rx="4.5"/>
  </g>
  <!-- one specular arc, top-left, so the face has a direction to the light -->
  <path d="M25 34 A32 32 0 0 1 50 18" fill="none" stroke="#FFE9A8" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
</svg>
