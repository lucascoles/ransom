# XcodeGen spec — a fallback way to regenerate Ransom.xcodeproj from scratch.
# The checked-in project file is authoritative; this exists so the project can be
# rebuilt if it ever gets mangled by a merge. Run: xcodegen generate
name: Ransom
options:
  bundleIdPrefix: com.ransom
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Ransom:
    type: application
    platform: iOS
    sources:
      - Ransom
      - RansomShared
    dependencies:
      - target: RansomShield
      - target: RansomShieldAction
      - target: RansomMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ransom.app
        CODE_SIGN_ENTITLEMENTS: Config/Ransom.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Ransom
        INFOPLIST_KEY_NSMotionUsageDescription: "Ransom uses motion to count your reps. Nothing is recorded or uploaded."
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

  RansomShield:
    type: app-extension
    platform: iOS
    sources:
      - RansomShield
      - RansomShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ransom.app.shield
        CODE_SIGN_ENTITLEMENTS: Config/RansomShield.entitlements
        INFOPLIST_FILE: Config/RansomShield-Info.plist

  RansomShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - RansomShieldAction
      - RansomShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ransom.app.shieldaction
        CODE_SIGN_ENTITLEMENTS: Config/RansomShieldAction.entitlements
        INFOPLIST_FILE: Config/RansomShieldAction-Info.plist

  RansomMonitor:
    type: app-extension
    platform: iOS
    sources:
      - RansomMonitor
      - RansomShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ransom.app.monitor
        CODE_SIGN_ENTITLEMENTS: Config/RansomMonitor.entitlements
        INFOPLIST_FILE: Config/RansomMonitor-Info.plist
